# =====================================================================
# Shared framework configuration. Values here are overridden by
# config/<env>.properties, then environment variables, then -D system
# properties (highest precedence).
# =====================================================================

# ---------------------------------------------------------------------
# Platform: android | ios
# ---------------------------------------------------------------------
platform=android

# ---------------------------------------------------------------------
# Appium server. Set appium.server.managed=true to let the framework
# start and stop a local Appium server automatically.
# ---------------------------------------------------------------------
appium.server.managed=false
appium.server.url=http://127.0.0.1:4723
appium.server.host=127.0.0.1
appium.server.port=4723
appium.server.basePath=/
appium.server.logLevel=info
# Optional path to the Appium CLI entry point when the server is managed.
# Windows example:
# appium.server.appium.js=C:/Users/<user>/AppData/Roaming/npm/node_modules/appium/build/lib/main.js
# macOS/Linux example:
# appium.server.appium.js=/usr/local/lib/node_modules/appium/build/lib/main.js

# ---------------------------------------------------------------------
# Cloud device farms (BrowserStack / Sauce Labs)
# ---------------------------------------------------------------------
cloud.enabled=false
cloud.provider=browserstack
cloud.url=https://hub-cloud.browserstack.com/wd/hub
# Prefer environment variables CLOUD_USER / CLOUD_KEY instead of committing secrets.
# cloud.user=
# cloud.key=

# ---------------------------------------------------------------------
# Device selection
# ---------------------------------------------------------------------
device.registry=devices/devices.json
# device.registry.file=config/my-devices.json
# device.udid=emulator-5554
# device.name=Android Emulator 1
# device.platformVersion=14

# ---------------------------------------------------------------------
# Application under test. Defaults target the built-in Settings app.
# Set app.path to install a specific .apk / .ipa / .app bundle.
# ---------------------------------------------------------------------
app.path=
app.package=com.android.settings
app.activity=.Settings
app.bundleId=com.apple.Preferences
app.noReset=true
app.fullReset=false
app.autoGrantPermissions=false
# Keep the app running: do not force-stop/relaunch it when a session starts
# and do not kill it when the session ends.
app.forceLaunch=false
app.terminateOnQuit=false
# Do not install/launch the io.appium.settings helper on every session.
app.skipDeviceInitialization=true

# ---------------------------------------------------------------------
# Timeouts. explicit.wait is in seconds, polling.interval in millis.
# ---------------------------------------------------------------------
implicit.wait=0
explicit.wait=15
polling.interval=250
new.command.timeout=120
adb.exec.timeout=60
wda.launch.timeout=120
wda.connection.timeout=120

# ---------------------------------------------------------------------
# Framework behaviour
# ---------------------------------------------------------------------
retry.count=1
screenshot.on.failure=true
screenshot.on.success=true
# Record the full scenario as a video and split pass/fail evidence into
# target/screenshots/<pass|fail> and target/videos/<pass|fail>.
video.recording.enabled=true
parallel.threads=2

# Optional explicit path to the adb executable.
# adb.path=C:/Users/<user>/AppData/Local/Android/Sdk/platform-tools/adb.exe

# ---------------------------------------------------------------------
# Free-form capabilities applied to every session. Prefix a key with
# capability. and the remainder is sent to Appium as a capability.
# Example:
capability.appium:waitForIdleTimeout=1500
# capability.autoWebview=false
# ---------------------------------------------------------------------
