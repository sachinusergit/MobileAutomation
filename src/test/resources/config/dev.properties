# =====================================================================
# Developer workstation overrides. Keep this file free of secrets.
#
# Target: OPPO A54 (physical device) running the Meesho Supply app.
# =====================================================================

platform=android
appium.server.url=http://127.0.0.1:4723

# Device selection. Wireless ADB serial obtained from `adb devices`.
device.name=OPPO A54
device.udid=192.168.1.180:43863

# Application under test
app.package=com.meesho.supply
app.activity=.default
app.noReset=true
app.fullReset=false

# Explicit waits stay short so a missing element never blocks the run.
explicit.wait=8

# Phone number used by the sign-up automation (10 digits, without +91).
meesho.signup.phone=8368155209

# The OPPO A54 denies WRITE_SECURE_SETTINGS to the shell user, so Appium
# cannot relax/restore the hidden API policy. Ask it to continue anyway.
capability.appium\:ignoreHiddenApiPolicyError=true

