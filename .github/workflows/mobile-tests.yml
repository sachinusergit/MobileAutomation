name: Mobile Automation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to execute
        type: choice
        options: [ android, ios ]
        default: android
      suite:
        description: TestNG suite file
        required: false
        default: src/test/resources/suites/testng-smoke.xml
      environment:
        description: Configuration environment
        required: false
        default: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.platform || 'android' }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  APPIUM_ARGS: --address 127.0.0.1 --port 4723 --log-level info

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Compile main and test sources
        run: mvn -B -DskipTests package

  android:
    name: Android tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'android' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Appium and UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium --version

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SUITE: ${{ github.event.inputs.suite || 'src/test/resources/suites/testng-smoke.xml' }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'ci' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            nohup appium $APPIUM_ARGS > appium.log 2>&1 &
            for i in $(seq 1 60); do
              if curl -sf http://127.0.0.1:4723/status > /dev/null; then break; fi
              sleep 2
            done
            mvn -B test -Denv="$ENVIRONMENT" -Dplatform=android -Ddevice.udid=emulator-5554 -DsuiteXmlFile="$SUITE"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            target/screenshots
            target/logs
            target/surefire-reports
            appium.log
          retention-days: 14

  ios:
    name: iOS tests
    runs-on: macos-14
    timeout-minutes: 75
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'ios' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Appium and XCUITest driver
        run: |
          npm install -g appium
          appium driver install xcuitest
          appium --version

      - name: Boot simulator
        run: |
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl bootstatus "iPhone 15" -b

      - name: Run iOS tests
        env:
          SUITE: ${{ github.event.inputs.suite || 'src/test/resources/suites/testng-ios.xml' }}
          ENVIRONMENT: ${{ github.event.inputs.environment || 'ci' }}
        run: |
          nohup appium $APPIUM_ARGS > appium.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4723/status > /dev/null; then break; fi
            sleep 2
          done
          mvn -B test -Denv="$ENVIRONMENT" -Dplatform=ios -Ddevice.name="iPhone 15" -DsuiteXmlFile="$SUITE"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ios
          path: target/allure-results
          retention-days: 14

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-ios
          path: |
            target/screenshots
            target/logs
            target/surefire-reports
            appium.log
          retention-days: 14
