name: Mobile Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_HOME: 'C:\Users\sachi\.jdks\openjdk-27'
  ANDROID_HOME: 'C:\Users\sachi\AppData\Local\Android\Sdk'
  ANDROID_SDK_ROOT: 'C:\Users\sachi\AppData\Local\Android\Sdk'
  ADB: 'C:\Users\sachi\AppData\Local\Android\Sdk\platform-tools\adb.exe'

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile main and test sources
        run: mvn -B -DskipTests package

  android:
    name: Android tests (self-hosted OPPO)
    runs-on: [ self-hosted, windows, mobile-automation ]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: adb start server and list devices
        shell: cmd
        run: |
          "%ADB%" start-server
          "%ADB%" devices -l

      - name: Run smoke suite on the phone
        shell: cmd
        run: |
          mvnw.cmd -B test -Pandroid -DsuiteXmlFile=src/test/resources/suites/testng-e2e-smoke.xml -Dvideo.recording.enabled=false -Dmaven.test.failure.ignore=true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            target/screenshots
            target/logs
            target/surefire-reports
          retention-days: 14

      - name: Publish TestNG report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: TestNG Smoke Suite
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false
